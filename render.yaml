services:
  - type: web
    name: livevibe-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      # REDIS_URL intentionally omitted — it's optional (server/redis.js
      # falls back to a no-op stub without it). Add it later from the
      # Render dashboard's Environment tab with an Upstash rediss:// URL
      # if you want a grace period on brief disconnects instead of an
      # instant offline flip.
      #
      # SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY also intentionally
      # omitted — optional, enables avatar uploads (server/supabase.js
      # falls back to disabling the feature without them). Add both from
      # the dashboard's Environment tab: Supabase Project Settings -> API.
